name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evalharness
          POSTGRES_PASSWORD: evalharness
          POSTGRES_DB: evalharness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://evalharness:evalharness@localhost:5432/evalharness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src/evalharness
      - run: uv run python scripts/run_poc.py
      - run: uv run pytest -q
      - name: Ensure PoC artifacts are clean
        run: |
          git diff --exit-code -- fixtures/poc/report.json fixtures/poc/report.html fixtures/poc/meta.json
