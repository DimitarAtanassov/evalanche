name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_ollama:
        description: Run the live pinned Ollama smoke test
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evalharness
          POSTGRES_PASSWORD: evalharness
          POSTGRES_DB: evalharness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://evalharness:evalharness@localhost:5432/evalharness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src/evalharness
      - run: uv run alembic upgrade head
      - run: uv run python scripts/run_poc.py
      - run: uv run pytest -q --cov=evalharness --cov-report=term-missing
      - run: uv run python scripts/benchmark_100k.py
      - name: Ensure PoC artifacts are clean
        run: |
          git diff --exit-code -- fixtures/poc/report.json fixtures/poc/report.html fixtures/poc/meta.json

  live-ollama:
    if: github.event_name == 'workflow_dispatch' && inputs.live_ollama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: docker compose up -d postgres ollama
      - run: docker compose exec -T ollama ollama pull llama3.2:1b
      - run: docker compose exec -T ollama ollama pull nomic-embed-text
      - run: uv sync
      - run: uv run python scripts/live_ollama_smoke.py
