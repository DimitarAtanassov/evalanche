[project]
name = "evalharness"
version = "0.1.0"
description = "Production-grade LLM evaluation harness (evalctl + evald)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Eval Harness" }]
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
evalctl = "evalharness.cli:app"

[project.entry-points."evalharness.providers"]
ollama = "evalharness.providers.ollama:OllamaProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM103", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evalharness"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
